<!DOCTYPE html>
<html lang="es">
  <head>
    {{> head}}
    <title>Página no encontrada · {{brandName}}</title>
    <meta name="robots" content="noindex" />
  </head>
  <body class="has-hero">
    {{> header}}

    <div class="page-shell">
      <main id="main" class="not-found" data-header-contrast>
        <div class="container not-found__content">
          <p class="eyebrow eyebrow--light">Error 404</p>
          <h1>Esta página se ha salido <span>de la carretera.</span></h1>
          <p>La dirección no existe o el vehículo que buscabas ya no está disponible.</p>
          <div class="not-found__actions">
            <a class="button button--light" href="/">Volver al inicio</a>
            <a class="button button--ghost" href="/#inventory">Ver vehículos</a>
          </div>
        </div>
      </main>

      {{> footer}}
    </div>
  </body>
</html>
