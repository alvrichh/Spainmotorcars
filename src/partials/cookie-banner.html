<div
  class="cookie-banner"
  role="dialog"
  aria-live="polite"
  aria-label="Aviso de cookies"
  data-cookie-banner
  hidden
>
  <p class="cookie-banner__text">
    Usamos cookies técnicas y, con tu permiso, de análisis para mejorar la web.
    <a href="/cookies">Más información</a>
  </p>
  <div class="cookie-banner__actions">
    <button class="cookie-banner__button cookie-banner__button--ghost" type="button" data-cookie-choice="rejected">
      Rechazar
    </button>
    <button class="cookie-banner__button" type="button" data-cookie-choice="accepted">
      Aceptar
    </button>
  </div>
</div>
